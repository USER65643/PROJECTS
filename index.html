<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USER.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Suisse+Intl:wght@300;400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #080808;
    --white: #f5f2ed;
    --gray-1: #1a1a1a;
    --gray-2: #2e2e2e;
    --gray-3: #555;
    --gray-4: #888;
    --gray-5: #bbb;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Playfair Display', Georgia, serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--mono);
    overflow-x: hidden;
    cursor: none;
  }

  #cursor {
    width: 12px; height: 12px;
    background: var(--white);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.15s ease, background 0.2s;
    transform: translate(-50%, -50%);
  }

  #cursor-ring {
    width: 36px; height: 36px;
    border: 1px solid rgba(245,242,237,0.35);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.45s cubic-bezier(0.23,1,0.32,1), width 0.3s, height 0.3s, border-color 0.3s;
  }

  body.hovering #cursor { transform: translate(-50%,-50%) scale(0); }
  body.hovering #cursor-ring { width: 56px; height: 56px; border-color: rgba(245,242,237,0.7); }

  #loader {
    position: fixed; inset: 0; background: var(--black);
    z-index: 8888;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
  }

  #loader-name {
    font-family: var(--serif);
    font-size: clamp(32px, 6vw, 52px);
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.01em;
    overflow: hidden;
    white-space: nowrap;
  }

  #loader-bar-wrap {
    width: 180px; height: 1px; background: var(--gray-2);
  }

  #loader-bar {
    height: 1px; background: var(--white); width: 0%;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 40px;
    opacity: 0;
    transition: opacity 0.8s ease 0.3s;
  }

  main.visible { opacity: 1; }

  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 36px 0 0;
    border-bottom: 1px solid var(--gray-2);
    padding-bottom: 28px;
  }

  .nav-logo {
    font-family: var(--serif); font-style: italic; font-size: 18px;
    color: var(--white); text-decoration: none;
  }

  .nav-links { display: flex; gap: 32px; }

  .hero-title {
    font-family: var(--serif);
    font-size: clamp(54px, 10vw, 96px);
  }

  .btn-primary {
    background: var(--white);
    color: var(--black);
    padding: 14px 28px;
    text-decoration: none;
  }
</style>
</head>

<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div id="loader">
  <div id="loader-name"></div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<main id="main">

  <nav>
    <a href="#" class="nav-logo">USER</a>
    <div class="nav-links">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1 class="hero-title">
      Building<br><em>things</em><br>that work
    </h1>
  </section>

</main>

<script>
  const cur = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  let mx=0,my=0,rx=0,ry=0;

  document.addEventListener('mousemove', e => {
    mx=e.clientX; my=e.clientY;
    cur.style.left=mx+'px';
    cur.style.top=my+'px';
  });

  (function animRing() {
    rx += (mx-rx)*0.12;
    ry += (my-ry)*0.12;
    ring.style.left=rx+'px';
    ring.style.top=ry+'px';
    requestAnimationFrame(animRing);
  })();

  const loaderName = document.getElementById('loader-name');
  const name = 'USER.dev';

  name.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.animationDelay = (i * 0.06) + 's';
    loaderName.appendChild(s);
  });

  setTimeout(() => {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('main').classList.add('visible');
  }, 1800);
</script>

</body>
</html>
